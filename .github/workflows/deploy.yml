name: Deploy Flutter Web
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build Web Application
        run: |
          cd frontend/myapp
          flutter pub get
          flutter build web --base-href "/saferoute-backend/"
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/myapp/build/web
          branch: gh-pages
